name: Build & push images

# Builds the backend + frontend Docker images and pushes them to the GitHub
# Container Registry (GHCR). The VPS then only ever PULLS these pre-built images
# (see docker-compose.registry.yml + deploy.sh) — it never runs `docker build`,
# which can OOM a small server on the frontend (Vite) build.
#
# Why CI and not "build on my Mac": GitHub runners are linux/amd64, which is
# what a normal VPS is. An Apple-Silicon Mac builds arm64 images that won't run
# on an amd64 box without slow emulation. Building here gets the arch right.
#
# Images produced (private, inherit repo visibility):
#   ghcr.io/adwaithjk98-jpg/seohealth-backend
#   ghcr.io/adwaithjk98-jpg/seohealth-frontend
# Tags per build: latest, sha-<short>, <branch>, and <tag> for v* releases.

on:
  push:
    # frontend-redesign is here so images build before the branch is merged;
    # drop it once you deploy from main.
    branches: [main, frontend-redesign]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: seohealth-backend
            context: ./backend
          - image: seohealth-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions so repeat builds are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Reverse-proxy /api/* to the API container on the user-defined network.
    # No trailing slash on proxy_pass — preserving the /api prefix is required
    # because FastAPI routes are registered under /api/*.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: audits stream events on /api/audits/{id}/stream. Default Nginx
        # buffering destroys live UX, and a short read timeout silently kills
        # the connection mid-audit.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # SPA fallback. Without this, a hard refresh on /audits/123 or
    # /auth/verify returns 404 instead of falling through to client-side
    # routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

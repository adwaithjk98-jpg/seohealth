# Compose v2: no `version:` field (deprecated). Services join a single
# user-defined network so service names resolve as DNS hostnames
# (`postgres`, `redis`, `api`, `worker`, `frontend`).
#
# This base file is production-shaped: only Nginx (frontend service) is
# published to the host on :80. The API is NOT published — Nginx reverse-
# proxies /api/* to it on the internal network. Uvicorn runs WITHOUT
# `--reload`, no source bind mounts, no restart policies, no log caps —
# every dev/prod-specific knob lives in an override file:
#
#   docker compose up -d --build
#     → base only (production-shaped, safe to deploy as-is)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#     → base + dev override (uvicorn --reload, source mounts, :8000 republished)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#     → base + prod override (restart policies, log caps, required secrets, no defaults)

x-backend-env: &backend-env
  # Internal service names — these are the only hardcoded URLs; both point
  # at sibling containers on `audithealth-net`. Overriding from host .env
  # would break the wiring.
  DATABASE_URL: postgresql+psycopg://audithealth:audithealth@postgres:5432/audithealth
  REDIS_URL: redis://redis:6379/0
  APP_ENV: ${APP_ENV:-development}
  # Magic-link emails / stdout-printed links target Nginx on :80. The dev
  # override file flips this back to :5173 for the host Vite workflow.
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  FROM_EMAIL: ${FROM_EMAIL:-Local SEO Health Monitor <onboarding@resend.dev>}
  MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-15}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-session}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  AUDIT_MAX_CONCURRENT_DRIVERS: ${AUDIT_MAX_CONCURRENT_DRIVERS:-1}
  AUDIT_PAGE_TIMEOUT: ${AUDIT_PAGE_TIMEOUT:-30}
  AUDIT_SCRIPT_TIMEOUT: ${AUDIT_SCRIPT_TIMEOUT:-20}
  # Razorpay (Test Mode for Phase 3). Empty key id ⇒ in-app mock checkout
  # — the no-cost path used by the prompt-block builds. See backend/.env.example
  # for the full var list and what each one gates.
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_PAID_PLAN_ID: ${RAZORPAY_PAID_PLAN_ID:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  PAID_PLAN_PRICE_LABEL: ${PAID_PLAN_PRICE_LABEL:-₹549 / month}
  RAZORPAY_MAX_PLAN_ID: ${RAZORPAY_MAX_PLAN_ID:-}
  MAX_PLAN_PRICE_LABEL: ${MAX_PLAN_PRICE_LABEL:-₹2,500 / month}
  # Founder/admin allowlist for /api/admin/* (the stats panel).
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  # Web Push (VAPID). Empty ⇒ push sending is a no-op (dev/smoke-test default).
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@seohealth.in}
  # Sentry error monitoring. Empty ⇒ no-op.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  # Competitor-insights LLM phrasing (deterministic fallback when empty).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_INSIGHTS_MODEL: ${ANTHROPIC_INSIGHTS_MODEL:-claude-haiku-4-5-20251001}
  # PageSpeed Insights (Performance / Site-Speed pillar). Empty key = the
  # anonymous low-quota path; set a key in prod for the higher daily quota.
  PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
  PAGESPEED_STRATEGY: ${PAGESPEED_STRATEGY:-mobile}
  # Instagram Graph API — Model A (business_discovery). Disabled until a
  # long-lived Page token is set; falls back to the OG-tag scraper otherwise.
  IG_GRAPH_ENABLED: ${IG_GRAPH_ENABLED:-false}
  IG_GRAPH_ACCESS_TOKEN: ${IG_GRAPH_ACCESS_TOKEN:-}
  IG_GRAPH_USER_ID: ${IG_GRAPH_USER_ID:-17841413032640533}
  META_APP_ID: ${META_APP_ID:-1378304534203823}
  META_APP_SECRET: ${META_APP_SECRET:-}
  # HTTP rate limiting (slowapi).
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUEST_LINK: ${RATE_LIMIT_REQUEST_LINK:-5/minute}
  RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:-30/minute}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audithealth
      POSTGRES_PASSWORD: audithealth
      POSTGRES_DB: audithealth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audithealth -d audithealth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - audithealth-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - audithealth-net

  api:
    build:
      context: ./backend
    image: audithealth-backend:dev
    # Base command runs migrations then uvicorn WITHOUT --reload. The dev
    # override re-adds --reload (paired with a source bind mount). Migrations
    # run on every API container restart; see project_notes.md "Migration
    # handling on prod restart" for the single-replica constraint that
    # depends on.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    # No `ports:` — Nginx (frontend) is the host entry point. The dev
    # override re-publishes 8000:8000 for direct curl / npm-run-dev access.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Chromium uses /dev/shm for IPC buffers and crashes on Docker's default
    # 64MB. 1GB is the actual fix for the --disable-dev-shm-usage workaround
    # baked into scrapers/driver.py.
    shm_size: "1gb"
    networks:
      - audithealth-net

  worker:
    # Re-uses the image built by the `api` service — single build, two
    # processes. Do NOT add a second `build:` here; compose v2 idiom is one
    # tagged image, multiple services.
    image: audithealth-backend:dev
    command: ["python", "-m", "scripts.run_worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker is where Chromium actually runs — this is the load-bearing copy.
    shm_size: "1gb"
    networks:
      - audithealth-net

  competitor-worker:
    # Low-priority queue: competitor cache refreshes + Discovery Scans. Reuses
    # the api image (single build). Runs Chromium for competitor scrapes, so it
    # needs the same 1GB /dev/shm as the audit worker.
    image: audithealth-backend:dev
    command: ["python", "-m", "scripts.run_competitor_worker"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: "1gb"
    networks:
      - audithealth-net

  scheduler:
    # rq-scheduler: enqueues auto-audits, the weekly digest, competitor
    # refreshes, and data pruning on cron. No Chromium here — it only enqueues
    # jobs the workers run, so no /dev/shm bump needed.
    image: audithealth-backend:dev
    command: ["python", "-m", "scripts.run_scheduler"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - audithealth-net

  frontend:
    build:
      context: ./frontend
    image: audithealth-frontend:dev
    ports:
      - "80:80"
    depends_on:
      # No `service_healthy` — Nginx happily starts before the API and just
      # 502s on /api/* until the API is up. Acceptable for dev.
      - api
    networks:
      - audithealth-net

volumes:
  postgres_data:

networks:
  audithealth-net:
